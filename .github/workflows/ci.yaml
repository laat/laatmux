name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

# A push to a pull request cancels the run of its previous push. Every
# other run, each push to main, has a group of its own. In one shared
# group the next merge would cancel the run in progress, or, without
# cancel-in-progress, replace the run pending behind it, and that
# merge commit would get no verdict.
concurrency:
  group: ${{ github.workflow }}-${{ case(github.event_name == 'pull_request', github.ref, github.run_id) }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  test:
    name: test (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: go.mod

      # The tmux tests skip without it; the end-to-end test needs it
      # for the daemon's first poll to complete. On ubuntu-latest it is
      # apt's tmux (3.4 on 24.04), for the tests that pin facts of tmux
      # 3.2-3.4; the image has it today, and the install keeps the job
      # from depending on that. On macOS it is brew's newest release.
      - name: tmux (macOS)
        if: runner.os == 'macOS'
        run: brew install tmux

      - name: tmux (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y tmux

      # A runner image that changes the tmux version shows here.
      - name: tmux version
        run: tmux -V

      - name: gofmt
        run: |
          out=$(gofmt -l .)
          if [ -n "$out" ]; then
            echo "files need gofmt:"
            echo "$out"
            exit 1
          fi

      - name: go mod tidy
        run: |
          go mod tidy
          git diff --exit-code go.mod go.sum

      - name: go vet
        run: go vet ./...

      - name: go build
        run: go build ./...

      # -v puts each skipped test and its reason in the log, so a test
      # that stops running on one runner is visible.
      - name: go test
        run: go test -race -v ./...
